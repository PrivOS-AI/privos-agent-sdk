# Protected publish.
#
# `ci.yml` proves the release lifecycle without credentials, on every branch and
# fork. This workflow does the one thing that workflow deliberately cannot: it
# publishes. Publishing from CI is not a convenience — npm provenance is a
# signed statement about *where* a tarball was built, and it can only be
# produced by the builder. A tarball published from a laptop has none, which is
# why the 0.3.0-rc line carries no attestation.
#
# The artifact is built once, in `verify`, and `publish` uploads that exact
# tarball. Rebuilding in the publish job would sign a different artifact from
# the one that passed the gates.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. One-time setup on
# npmjs.com (@privos_ai/privos-agent-sdk -> Settings -> Trusted Publisher):
#   Publisher: GitHub Actions | Organization: PrivOS-AI | Repository: privos-agent-sdk
#   Workflow filename: release.yml | Environment: release
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. 0.3.0 (must match package.json)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Consumer smoke (packed specifiers + NodeNext resolution)
        run: bun run test:dist

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --silent | tail -1)"
          version="$(node -p 'require("./package.json").version')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version is stated in three places — the manifest, the git tag, and
      # the dispatch input. A release where they disagree publishes something
      # nobody asked for, so they are compared before anything is signed.
      - name: Version matches the release request
        run: |
          version="${{ steps.pack.outputs.version }}"
          requested="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          requested="${requested#v}"
          if [ "$version" != "$requested" ]; then
            echo "::error::package.json is $version but the release asked for $requested"
            exit 1
          fi
          case "$version" in
            *-*) echo "::notice::$version is a prerelease and will be published under the 'next' tag" ;;
            *)   echo "::notice::$version is a stable release" ;;
          esac

      - name: Inspect the tarball
        run: |
          tarball="${{ steps.pack.outputs.tarball }}"
          echo "sha256: $(sha256sum "$tarball" | cut -d' ' -f1)"
          contents="$(tar -tzf "$tarball")"

          for required in package/package.json package/README.md package/LICENSE; do
            echo "$contents" | grep -qx "$required" || { echo "::error::$required missing from the tarball"; exit 1; }
          done

          if echo "$contents" | grep -Ei '(^|/)\.env|(^|/)\.npmrc|secret|\.pem$|\.key$'; then
            echo "::error::tarball contains a file that looks like a credential"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Gate the credential behind an environment so a push to a tag cannot
    # publish on its own — a reviewer approves the release.
    environment: release
    permissions:
      contents: read
      # Required for provenance: the OIDC token is what ties the published
      # tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: release-tarball

      # Auth is npm Trusted Publishing (OIDC) — no token. Needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # `--ignore-scripts`: the tarball is already built and verified, and a
      # lifecycle script running at publish time would execute code that no gate
      # in this workflow has looked at.
      - name: Publish with provenance
        run: |
          tarball="${{ needs.verify.outputs.tarball }}"
          dist_tag=latest
          case "${{ needs.verify.outputs.version }}" in
            *-*) dist_tag=next ;;
          esac
          npm publish "$tarball" \
            --provenance \
            --access public \
            --ignore-scripts \
            --tag "$dist_tag"

      - name: Verify what the registry now serves
        run: |
          version="${{ needs.verify.outputs.version }}"
          npm view "@privos_ai/privos-agent-sdk@$version" \
            name version dist-tags license repository dist.attestations --json
